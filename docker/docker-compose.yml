services:
  postgres:
    image: postgres:16-alpine
    container_name: fg-careers-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: fgcareers
      POSTGRES_PASSWORD: fgcareers
      POSTGRES_DB: fgcareers
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fgcareers']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
